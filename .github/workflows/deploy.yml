name: Deploy to cPanel via FTP

# The git repo root is OreksGlobal/, so this file must live here (GitHub ignores
# workflows in subfolders) and the Laravel app is in OreksglobalwebLaravel/.
#
# Server layout: the whole Laravel project lives in /public_html/ (relative to the
# FTP user's home). A root .htaccess (generated below) sends every request to
# public/, so app/, config/, vendor/ etc. are never served directly.
#
# One-time server setup: create /public_html/.env with the production settings
# (it is never deployed). The storage/ and bootstrap/cache folders are created
# by the first deploy; runtime files inside them are never overwritten.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: OreksglobalwebLaravel
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: OreksglobalwebLaravel/package-lock.json

      - name: Install front-end dependencies
        run: npm ci

      - name: Build production assets
        run: npm run build

      - name: Stage release
        run: |
          mkdir -p dist
          rsync -a ./ dist/ \
            --exclude '/dist' \
            --exclude '/node_modules' \
            --exclude '/tests' \
            --exclude '/public/hot' \
            --exclude '/storage/logs' \
            --exclude '/storage/framework' \
            --exclude '/storage/app/public' \
            --exclude '/bootstrap/cache' \
            --exclude '/database/*.sqlite' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude '.git' \
            --exclude '.github'
          # Runtime folders: created on the first deploy, then left alone
          for d in storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs bootstrap/cache; do
            mkdir -p "dist/$d" && touch "dist/$d/.gitkeep"
          done
          # Send all requests to public/ and hide dotfiles
          cat > dist/.htaccess <<'EOF'
          <IfModule mod_rewrite.c>
              RewriteEngine On
              RewriteRule ^\.(?!well-known) - [F,L]
              RewriteCond %{REQUEST_URI} !^/public/
              RewriteRule ^(.*)$ public/$1 [L]
          </IfModule>
          EOF

      - name: Deploy to /public_html/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: server209.web-hosting.com
          username: orekqvyv
          password: ${{ secrets.FTP_PASSWORD }}
          # protocol: ftps   # enable if the host supports it (encrypts the password)
          local-dir: ./OreksglobalwebLaravel/dist/
          server-dir: /public_html/

      # Migration step disabled for now - hits the token-gated
      # /deploy/migrate webhook (DeployController) to run
      # `php artisan migrate --force` on the live server as the deploy's
      # last step. Re-enable by uncommenting below.
      # - name: Run database migrations
      #   run: |
      #     curl -sf -X POST "https://medical.oreksglobal.com/deploy/migrate" \
      #       -H "X-Deploy-Token: ${{ secrets.DEPLOY_MIGRATE_TOKEN }}"
